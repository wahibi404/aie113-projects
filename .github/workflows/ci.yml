name: Raqib CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-service.txt
      - run: ruff check raqib scripts tests
      - name: Download published dataset
        run: |
          mkdir -p tracks/fraud/data
          curl --fail --location --retry 3 https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv --output tracks/fraud/data/creditcard.csv
      - run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python scripts/train.py
      - run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 pytest -q
      - name: Build and smoke test container
        run: |
          docker build -t raqib:ci .
          docker run -d --name raqib -p 127.0.0.1:8000:8000 raqib:ci
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then break; fi
            sleep 2
          done
          python -c 'import json; print(json.dumps(json.load(open("tests/golden.json"))["payment"]))' > /tmp/raqib-payment.json
          curl --fail --silent -H 'Content-Type: application/json' -d @/tmp/raqib-payment.json http://127.0.0.1:8000/score | python -c 'import json,sys; result=json.load(sys.stdin); assert result["reasons"][0]["feature"] == "V14"; assert result["score"] > .99; print(result["decision"], result["score"])'
