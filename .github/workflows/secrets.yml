name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: trufflesecurity/trufflehog@v3.93.0
        with:
          extra_args: --results=verified,unknown
